services:
  api:
    # Reutilizamos a mesma imagem para manter a base de execução igual entre a API
    # principal e o provider, reduzindo drift de ambiente e facilitando a evolução
    # futura para múltiplos serviços com a mesma base.
    build:
      context: .
    image: desafio-observabilidade-b3:local
    ports:
      - "8000:8000"
    environment:
      MOCK_PROVIDER_URL: http://mock-provider:8001
      MOCK_PROVIDER_MODE: success
      PROVIDER_TIMEOUT_SECONDS: "1.0"
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://lgtm:4318/v1/traces
    depends_on:
      mock-provider:
        condition: service_healthy
      lgtm:
        condition: service_healthy
    # Usamos 127.0.0.1 dentro do próprio container para validar a API localmente
    # sem depender da porta publicada do host; isso testa o processo real e não o
    # mapeamento externo.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.request; r = urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3); sys.exit(0 if r.status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  mock-provider:
    # O provider precisa ficar saudável antes da API iniciar as chamadas de negócio,
    # porque a API depende da rota /validate para autorizar o fluxo do usuário.
    build:
      context: .
    image: desafio-observabilidade-b3:local
    environment:
      OTEL_EXPORTER_OTLP_TRACES_ENDPOINT: http://lgtm:4318/v1/traces
    command: ["uvicorn", "mock_provider.main:app", "--host", "0.0.0.0", "--port", "8001"]
    depends_on:
      lgtm:
        condition: service_healthy
    # Usamos o nome do serviço do Compose para resolver a dependência interna da API,
    # evitando localhost, que apontaria para o próprio container e não para o provider.
    # A checagem válida envia parâmetros reais de healthcheck para /validate, porque
    # esse endpoint exige user_id, movie_id e mode para responder corretamente.
    # Não instalamos curl nem wget porque a imagem já traz Python e a biblioteca
    # padrão do stdlib é suficiente para validar o endpoint com falha explícita.
    # Healthcheck é diferente de apenas confirmar que o processo subiu; ele mede a
    # resposta real do serviço em rede e só marca como saudável quando a rota responde.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys, urllib.parse, urllib.request; params = urllib.parse.urlencode({'user_id': 'healthcheck', 'movie_id': 'healthcheck', 'mode': 'success'}); url = 'http://127.0.0.1:8001/validate?' + params; r = urllib.request.urlopen(url, timeout=3); sys.exit(0 if r.status == 200 else 1)"
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  prometheus:
    image: prom/prometheus:v3.15.0
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      api:
        condition: service_healthy

  lgtm:
    image: grafana/otel-lgtm:0.36.0
    ports:
      - "3001:3000"
      - "4317:4317"
      - "4318:4318"
      - "3200:3200"

  grafana:
    image: grafana/grafana:13.2.3
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./grafana-datasource.yml:/etc/grafana/provisioning/datasources/prometheus.yml:ro
      - ./grafana-dashboard-provider.yml:/etc/grafana/provisioning/dashboards/red-dashboard.yml:ro
      - ./grafana-dashboard-red.json:/var/lib/grafana/dashboards/red-dashboard.json:ro
    depends_on:
      prometheus:
        condition: service_started

  k6-load-test:
    image: grafana/k6:2.3.0
    profiles:
      - load-test
    environment:
      BASE_URL: ${K6_BASE_URL:-http://api:8000}
      K6_VUS: ${K6_VUS:-50}
      K6_DURATION: ${K6_DURATION:-5m}
    volumes:
      - ./load.js:/load.js:ro
    command: ["run", "/load.js"]
    depends_on:
      api:
        condition: service_healthy
