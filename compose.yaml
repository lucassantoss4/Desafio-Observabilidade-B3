services:
  api:
    # Reutilizamos a mesma imagem para manter a base de execução igual entre a API
    # principal e o provider, reduzindo drift de ambiente e facilitando a evolução
    # posterior para múltiplos serviços com a mesma base.
    build:
      context: .
    image: desafio-observabilidade-b3:local
    ports:
      - "8000:8000"
    environment:
      MOCK_PROVIDER_URL: http://mock-provider:8001
      MOCK_PROVIDER_MODE: success
      PROVIDER_TIMEOUT_SECONDS: "1.0"
    depends_on:
      - mock-provider

  mock-provider:
    # O provider é executado pela mesma imagem, mas com um comando específico para
    # expor a rota /validate em 8001 sem publicar a porta no host nesta etapa.
    build:
      context: .
    image: desafio-observabilidade-b3:local
    command: ["uvicorn", "mock_provider.main:app", "--host", "0.0.0.0", "--port", "8001"]
    # A API resolve o provedor pelo nome do serviço dentro da rede do Compose.
    # Esse nome é estável e substitui o uso de localhost, que só aponta para o próprio
    # container e não para o serviço do provider.
    # Ainda não adicionamos healthchecks porque esta versão inicial foca apenas no
    # arranque básico dos dois serviços; os checks de status e dependência serão
    # adicionados na próxima fase.
